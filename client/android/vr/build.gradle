plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xboxvr.vr'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId "dev.xboxvr.vr"
        // Quest 2 and 3 run Android 10+.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Quest headsets are arm64 only; building anything else just inflates the APK.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        // The OpenXR loader AAR ships as a prefab package. Without this, its headers and
        // .so are never exposed to CMake and find_package(OpenXR) cannot resolve.
        prefab true
    }

    sourceSets {
        main.java.srcDirs += '../shared/java'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // The Khronos loader, which on Android also supplies the OpenXR headers to CMake.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.62'
}
